<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Affifa Taskeen, Geospatial Data Engineer and GeoAI Engineer. View my portfolio.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f7fb"/><stop offset="1" stop-color="#e6eef8"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0661f"/><stop offset="1" stop-color="#0a7fc2"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0661f"/><stop offset="1" stop-color="#f0a04b"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="320" rx="22"/></clipPath>
    <clipPath id="globeclip"><circle cx="1075" cy="160" r="118"/></clipPath>
    <style>
      text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
      .topo path { fill: none; stroke: #0a7fc2; stroke-opacity: .18; stroke-width: 1.4; stroke-dasharray: 6 10; animation: drift 30s linear infinite; }
      .topo .c1 { animation-duration: 42s; animation-direction: reverse; }
      @keyframes drift { to { stroke-dashoffset: -480; } }
      .mer { fill: none; stroke: #0a7fc2; stroke-opacity: .45; stroke-width: 1.2; transform-origin: 1075px 160px; animation: spin 6s linear infinite; }
      @keyframes spin { 0% { transform: scaleX(1); } 50% { transform: scaleX(0); } 100% { transform: scaleX(-1); } }
      .par { fill: none; stroke: #0a7fc2; stroke-opacity: .3; stroke-width: 1; }
      .dot { fill: #e0661f; stroke: #fff; stroke-width: 2; }
      .pulse { fill: #e0661f; transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
      @keyframes pulse { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(4); opacity: 0; } }
      .in1, .in2, .in3, .in4 { opacity: 0; animation: rise .9s ease-out forwards; }
      .in2 { animation-delay: .35s; } .in3 { animation-delay: .7s; } .in4 { animation-delay: 1.05s; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      .glow { animation: glow 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes glow { 0%, 100% { opacity: .0; transform: scale(1); } 50% { opacity: .45; transform: scale(1.08, 1.3); } }
      .arrow { animation: nudge 1.6s ease-in-out infinite; }
      @keyframes nudge { 50% { transform: translateX(5px); } }
      .chip { font-size: 18px; font-weight: 600; fill: #56637a; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
  <rect width="1280" height="320" fill="url(#bg)"/>
  <g class="topo">
    <path class="c0" d="M-40 40 C 160 -10 280 100 440 40 S 720 -30 880 30 S 1120 100 1320 30"/>
    <path class="c1" d="M-40 72 C 160 22 280 132 440 72 S 720 2 880 62 S 1120 132 1320 62"/>
    <path class="c0" d="M-40 104 C 160 54 280 164 440 104 S 720 34 880 94 S 1120 164 1320 94"/>
    <path class="c1" d="M-40 136 C 160 86 280 196 440 136 S 720 66 880 126 S 1120 196 1320 126"/>
    <path class="c0" d="M-40 168 C 160 118 280 228 440 168 S 720 98 880 158 S 1120 228 1320 158"/>
    <path class="c1" d="M-40 200 C 160 150 280 260 440 200 S 720 130 880 190 S 1120 260 1320 190"/>
    <path class="c0" d="M-40 232 C 160 182 280 292 440 232 S 720 162 880 222 S 1120 292 1320 222"/>
    <path class="c1" d="M-40 264 C 160 214 280 324 440 264 S 720 194 880 254 S 1120 324 1320 254"/>
    <path class="c0" d="M-40 296 C 160 246 280 356 440 296 S 720 226 880 286 S 1120 356 1320 286"/>
  </g>

  <circle cx="1075" cy="160" r="132" fill="#0a7fc2" opacity=".08"/>
  <circle cx="1075" cy="160" r="118" fill="#ffffff" stroke="url(#grad)" stroke-width="3"/>
  <g clip-path="url(#globeclip)">
    <ellipse class="mer" cx="1075" cy="160" rx="118" ry="118" style="animation-delay:0.0s"/>
    <ellipse class="mer" cx="1075" cy="160" rx="118" ry="118" style="animation-delay:-1.0s"/>
    <ellipse class="mer" cx="1075" cy="160" rx="118" ry="118" style="animation-delay:-2.0s"/>
    <ellipse class="mer" cx="1075" cy="160" rx="118" ry="118" style="animation-delay:-3.0s"/>
    <ellipse class="mer" cx="1075" cy="160" rx="118" ry="118" style="animation-delay:-4.0s"/>
    <ellipse class="mer" cx="1075" cy="160" rx="118" ry="118" style="animation-delay:-5.0s"/>
    <ellipse class="par" cx="1075" cy="262.2" rx="59.0" ry="7.1"/>
    <ellipse class="par" cx="1075" cy="219.0" rx="102.2" ry="12.3"/>
    <ellipse class="par" cx="1075" cy="160.0" rx="118.0" ry="14.2"/>
    <ellipse class="par" cx="1075" cy="101.0" rx="102.2" ry="12.3"/>
    <ellipse class="par" cx="1075" cy="57.8" rx="59.0" ry="7.1"/>
    <circle class="pulse" cx="1014" cy="165" r="6" style="animation-delay:0.0s"/><circle class="dot" cx="1014" cy="165" r="5"/>
    <circle class="pulse" cx="1040" cy="152" r="6" style="animation-delay:-0.6s"/><circle class="dot" cx="1040" cy="152" r="5"/>
    <circle class="pulse" cx="1056" cy="146" r="6" style="animation-delay:-1.2s"/><circle class="dot" cx="1056" cy="146" r="5"/>
    <circle class="pulse" cx="1115" cy="192" r="6" style="animation-delay:-1.7999999999999998s"/><circle class="dot" cx="1115" cy="192" r="5"/>
    <circle class="pulse" cx="1163" cy="139" r="6" style="animation-delay:-2.4s"/><circle class="dot" cx="1163" cy="139" r="5"/>
  </g>

  <g class="in1"><text x="64" y="104" font-size="52" font-weight="800" fill="#0f1b2d" letter-spacing="-1">Affifa Taskeen</text></g>
  <g class="in2"><text x="66" y="146" font-size="24" font-weight="700" fill="url(#grad)">Geospatial Data Engineer · GeoAI Engineer</text></g>
  <g class="in3"><text x="66" y="184" class="chip">🛰  Earth observation   ·   🗺  OGC data services   ·   🤖  LLMs on spatial data</text></g>

  <g class="in4">
    <rect class="glow" x="64" y="214" width="250" height="56" rx="28" fill="#e0661f"/>
    <rect x="64" y="214" width="250" height="56" rx="28" fill="url(#btn)"/>
    <text x="96" y="249" font-size="19" font-weight="700" fill="#ffffff">View my portfolio</text>
    <g class="arrow"><text x="270" y="249" font-size="20" font-weight="700" fill="#ffffff">→</text></g>
    <text x="336" y="249" font-size="15" fill="#56637a">iamaffifa.github.io</text>
  </g>
  </g>
</svg>
